# ============================================================
# BOARD Partner Portal — Netlify
#
# The Next.js runtime plugin handles server components, server
# actions and middleware. Environment variables are set in the
# Netlify UI (Site configuration -> Environment variables), never
# committed here — SUPABASE_SECRET_KEY in particular must only ever
# exist as a server-side variable.
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # ---- Secrets scanning -------------------------------------
  # Every environment variable is read at request time through
  # src/lib/env.ts rather than as a static `process.env.NAME`, which
  # the compiler would replace with the literal value at build time.
  # Verified by building with the real values and grepping: none of
  # them appear anywhere in .next outside the cache.
  #
  # So no key is exempted from scanning — if a value ever does reach
  # a real artifact, the build should fail and say so.
  #
  # The only omission is Turbopack's persistent build cache, which
  # records the build environment. It is never served and never part
  # of the deploy; Netlify keeps it in its own cache store.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived caching for the self-hosted brand faces and the
# gradient assets: they are content-stable and heavy.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The portal holds commercial data about named organisations; keep
# it out of search results and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
