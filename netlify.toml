# ============================================================
# BOARD Partner Portal — Netlify
#
# The Next.js runtime plugin handles server components, server
# actions and middleware. Environment variables are set in the
# Netlify UI (Site configuration -> Environment variables), never
# committed here — SUPABASE_SECRET_KEY in particular must only ever
# exist as a server-side variable.
# ============================================================

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # ---- Secrets scanning -------------------------------------
  # Netlify scans build files for the values of environment
  # variables. Two adjustments, both deliberately narrow.
  #
  # 1. Omit the Turbopack build cache. Verified by building with the
  #    real values and grepping the output: PORTAL_PASSPHRASE appears
  #    ONLY under .next/cache/turbopack — never in .next/static (what
  #    browsers download) and never in .next/server. The cache is a
  #    build artifact that is never served, so scanning it produces
  #    false positives on values that are not actually exposed.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**"

  # 2. Omit only the two keys that are designed to be public. A
  #    Supabase publishable key is meant to sit in client code — it
  #    is subject to row-level security, which this project has
  #    enabled with no policies, so it grants nothing.
  #
  #    PORTAL_PASSPHRASE is deliberately NOT listed here. It stays
  #    under active scanning, so if it ever is inlined into a real
  #    artifact the build fails and says so.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Long-lived caching for the self-hosted brand faces and the
# gradient assets: they are content-stable and heavy.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The portal holds commercial data about named organisations; keep
# it out of search results and out of frames.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
